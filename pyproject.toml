[tool.poetry]
name = "afq"
version = "0.1.0"
description = "Anti-Fragile Quality Investment Screening System"
authors = ["boo"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
playwright = "^1.40"
httpx = "^0.27"
pandas = "^2.1"
numpy = "^1.26"
anthropic = "^0.40"
python-dotenv = "^1.0"
rich = "^13.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
